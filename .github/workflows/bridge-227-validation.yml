name: Validate 2.2.7 hardened Setup bridge

on:
  push:
    branches:
      - phase-2.2.7-hardened-setup-bridge
    paths:
      - "src/native/PublicSetupEntry.cs"
      - "src/native/PublicSetupHost.cs"
      - "release/**"
      - ".github/workflows/bridge-227-validation.yml"
      - "version.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-bridge:
    runs-on: windows-latest

    steps:
      - name: Checkout only this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Repository and branch isolation
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'coachedai/tailscale-quick-repair') {
            throw "Wrong repository: $env:GITHUB_REPOSITORY"
          }
          if ($env:GITHUB_REF -ne 'refs/heads/phase-2.2.7-hardened-setup-bridge') {
            throw '2.2.7 bridge validation may only run on its isolated branch.'
          }

      - name: Require exact bridge metadata
        shell: pwsh
        run: |
          $version = Get-Content version.json -Raw | ConvertFrom-Json
          $publish = Get-Content release/publish.json -Raw | ConvertFrom-Json

          if ([string]$version.version -ne '3.0.0-phase2.2.7' -or [int64]$version.versionCode -ne 30000217) {
            throw 'Unexpected bridge version metadata.'
          }
          if ([string]$publish.version -ne [string]$version.version -or [int64]$publish.versionCode -ne [int64]$version.versionCode) {
            throw 'release/publish.json does not match version.json.'
          }
          if ([bool]$publish.publish -or [bool]$publish.requiresSetup -or [bool]$publish.publicInstaller) {
            throw '2.2.7 must stay an unpublished user-level bridge during validation.'
          }

      - name: Privacy preflight
        shell: powershell
        run: |
          .\release\privacy-scan.ps1 -Root .

      - name: Build routed user-level bridge
        shell: powershell
        run: |
          .\release\build.ps1 -OutputDirectory .\dist
          .\release\finalize-package.ps1 -OutputDirectory .\dist
          .\release\add-native-setup-routing.ps1 -OutputDirectory .\dist

      - name: Inspect bridge package
        shell: powershell
        run: |
          $zip = @(Get-ChildItem .\dist -Filter 'TailscaleQuickRepair-*.zip' -File)
          if ($zip.Count -ne 1) { throw "Expected one bridge ZIP; found $($zip.Count)." }

          $root = Join-Path $env:RUNNER_TEMP 'tqr-227-bridge'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $root -Force

          $manifest = Get-Content (Join-Path $root 'package-manifest.json') -Raw | ConvertFrom-Json
          if ([string]$manifest.version -ne '3.0.0-phase2.2.7' -or [int64]$manifest.versionCode -ne 30000217) {
            throw 'Bridge package metadata is wrong.'
          }

          $paths = @($manifest.files | ForEach-Object { [string]$_.path })
          foreach ($needed in @(
            'app/TailscaleQuickRepairSetup.exe',
            'app/TailscaleQuickRepairUpdater.exe',
            'app/Tailscale-Repair-UI.ps1',
            'version.json'
          )) {
            if ($needed -notin $paths) { throw "Bridge package is missing: $needed" }
          }

          if (@($paths | Where-Object { $_ -like 'program/*' }).Count -ne 0) {
            throw '2.2.7 bridge must not contain protected ProgramData files.'
          }

          foreach ($entry in $manifest.files) {
            $path = Join-Path $root ([string]$entry.path -replace '/', '\\')
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Manifest path is missing: $($entry.path)" }
            $item = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ([int64]$item.Length -ne [int64]$entry.size -or $hash -ne [string]$entry.sha256) {
              throw "Manifest verification failed: $($entry.path)"
            }
          }

          $setup = Join-Path $root 'app\TailscaleQuickRepairSetup.exe'
          $selfTest = Start-Process -FilePath $setup -ArgumentList '--self-test-installer' -WindowStyle Hidden -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) {
            throw "Packaged hardened Setup self-test failed: $($selfTest.ExitCode)."
          }

          $ui = [IO.File]::ReadAllText((Join-Path $root 'app\Tailscale-Repair-UI.ps1'), [Text.Encoding]::UTF8)
          foreach ($marker in @('$SetupHostPath','$requiresSetup = $false',"$psi.Arguments = '--upgrade'")) {
            if ($ui -notmatch [regex]::Escape($marker)) { throw "Bridge UI is missing: $marker" }
          }

          .\release\privacy-scan.ps1 -Root $root -SkipRepositoryIdentity

      - name: Upload validated bridge
        uses: actions/upload-artifact@v4
        with:
          name: quick-repair-3.0.0-phase2.2.7-bridge
          path: dist/*
          if-no-files-found: error
