name: Privacy-safe support export verification
on:
  push:
    branches: [work/5.2-private-export]
    paths: [src/**, release/**, docs/**, version.json, .github/workflows/export-development.yml]
concurrency:
  group: tqr-export-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require exact isolated repository and source
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'coachedai/tailscale-quick-repair' -or $env:GITHUB_REF_NAME -ne 'work/5.2-private-export') { throw 'Wrong repository or branch.' }
          if ((git remote get-url origin).Trim() -notmatch '^https://github.com/coachedai/tailscale-quick-repair(?:\.git)?$') { throw 'Wrong origin.' }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout mismatch.' }
      - name: Prepare reviewed integration
        shell: powershell
        run: |
          if (Test-Path release/prepare-support-export.ps1) { .\release\prepare-support-export.ps1 }
          if ((Get-Content release/publish.json -Raw | ConvertFrom-Json).publish) { throw 'Development cannot publish.' }
      - name: Privacy and repository preflight
        shell: powershell
        run: .\release\privacy-scan.ps1 -Root .
      - name: Build both final delivery paths
        shell: powershell
        run: |
          .\release\build.ps1 -OutputDirectory .\dist
          .\release\finalize-package.ps1 -OutputDirectory .\dist
          .\release\add-native-setup-routing.ps1 -OutputDirectory .\dist
          .\release\build-public.ps1 -OutputDirectory .\dist-public
          Copy-Item .\dist-public\* .\dist\ -Force
      - name: All native package and export gates
        shell: powershell
        run: .\release\test-packaged-runtime.ps1 -OutputDirectory .\dist -EvidenceDirectory .\test-evidence
      - name: Recheck privacy before source commit
        shell: powershell
        run: .\release\privacy-scan.ps1 -Root .
      - name: Commit only verified integration changes
        shell: pwsh
        run: |
          if ((git branch --show-current).Trim() -ne 'work/5.2-private-export') { throw 'Wrong branch.' }
          git add -u -- release/add-native-setup-routing.ps1 release/test-packaged-runtime.ps1 release/publish.json version.json
          $changes = @(git diff --cached --name-only)
          foreach ($p in $changes) {
            if ($p -notin @('release/add-native-setup-routing.ps1','release/test-packaged-runtime.ps1','release/publish.json','version.json')) { throw 'Unexpected staged change.' }
          }
          if ($changes.Count -eq 0) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire and verify 5.2.1 privacy-safe support export'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed.' }
          git push origin HEAD:refs/heads/work/5.2-private-export
          if ($LASTEXITCODE -ne 0) { throw 'Branch moved or push failed; no force push attempted.' }
      - name: Preserve synthetic test and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-native-evidence
          path: test-evidence/*
          if-no-files-found: warn
      - name: Preserve validated packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: export-validated-packages
          path: dist/*
          if-no-files-found: error
