name: Prepare and verify 3.4.2 hardening
on:
  push:
    branches: [fix/3.4.2-package-and-runtime-guards]
    paths: [.github/workflows/prepare-hardening.yml, release/prepare-3.4.2.py, release/test-packaged-runtime.ps1, release/write-integrity-manifest.ps1, src/native/OperationGate.cs, .gitattributes]
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.4.2-package-and-runtime-guards
      - name: Require isolated repository and branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'coachedai/tailscale-quick-repair' -or $env:GITHUB_REF_NAME -ne 'fix/3.4.2-package-and-runtime-guards') { throw 'Wrong repository or branch.' }
          if ((git remote get-url origin).Trim() -notmatch '^https://github.com/coachedai/tailscale-quick-repair(?:\.git)?$') { throw 'Wrong origin.' }
      - name: Prepare reviewed source changes with publishing disabled
        shell: pwsh
        run: |
          python -m py_compile release/prepare-3.4.2.py
          python release/prepare-3.4.2.py
          if ($LASTEXITCODE -ne 0) { throw 'Source preparation failed.' }
          New-Item -ItemType Directory -Path test-evidence -Force | Out-Null
          git diff -- src release .github/workflows/release.yml version.json > test-evidence/prepared-source.patch
      - name: Privacy and personal-data preflight
        shell: powershell
        run: .\release\privacy-scan.ps1 -Root .
      - name: Retain and verify the previously released packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path legacy -Force | Out-Null
          gh release download v3.0.0-phase3.4.1 --repo $env:GITHUB_REPOSITORY --dir legacy --pattern '*.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the prior release.' }
          $manifest = Get-Content updates/latest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne '3.0.0-phase3.4.1') { throw 'Prior release changed; re-review is required.' }
          $normal = Get-ChildItem legacy -Filter '*.zip' | Where-Object Name -notlike '*SetupPackage*'
          $setup = Get-ChildItem legacy -Filter '*SetupPackage*.zip'
          if ((Get-FileHash $normal.FullName -Algorithm SHA256).Hash -ne $manifest.package.sha256 -or (Get-FileHash $setup.FullName -Algorithm SHA256).Hash -ne $manifest.setup.sha256) { throw 'Prior release digest mismatch.' }
      - name: Build both final delivery packages
        shell: powershell
        run: |
          .\release\build.ps1 -OutputDirectory .\dist
          .\release\finalize-package.ps1 -OutputDirectory .\dist
          .\release\add-native-setup-routing.ps1 -OutputDirectory .\dist
          .\release\build-public.ps1 -OutputDirectory .\dist-public
          Copy-Item .\dist-public\* .\dist\ -Force
      - name: Execute native packaged regression tests
        shell: powershell
        run: .\release\test-packaged-runtime.ps1 -OutputDirectory .\dist -EvidenceDirectory .\test-evidence -LegacyDirectory .\legacy
      - name: Scan source again before committing tested changes
        shell: powershell
        run: .\release\privacy-scan.ps1 -Root .
      - name: Commit only tested source to the development branch
        shell: pwsh
        run: |
          if ((git branch --show-current).Trim() -ne 'fix/3.4.2-package-and-runtime-guards') { throw 'Wrong working branch.' }
          if ((Get-Content release/publish.json -Raw | ConvertFrom-Json).publish) { throw 'Publishing must remain disabled.' }
          git rm release/prepare-3.4.2.py .github/workflows/prepare-hardening.yml
          git add src release .github/workflows/release.yml version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Verify 3.4.2 package parity and ownership on native Windows'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed.' }
          git push origin HEAD:refs/heads/fix/3.4.2-package-and-runtime-guards
          if ($LASTEXITCODE -ne 0) { throw 'Development branch changed; no force push is permitted.' }
          git rev-parse HEAD
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-native-evidence
          path: test-evidence/*
          if-no-files-found: warn
      - name: Preserve validated development packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-validated-packages
          path: dist/*
          if-no-files-found: error
